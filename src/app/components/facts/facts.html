<section class="facts-section">
  <div class="facts-header" scrollReveal>
    <span class="text-mono-label">Behind the scenes</span>
    <h2 class="section-title">A few random <span class="text-gradient">facts about me</span></h2>
    <p class="body-large">
      Get to know the developer behind the code logs and terminal loaders.
    </p>
  </div>

  <div class="facts-grid">
    @for (item of factsList(); track item.text; let i = $index) {
      <div class="fact-card glass-panel" 
           scrollReveal 
           [revealDelay]="i * 60" 
           tilt>
        <span class="fact-icon">{{ item.icon }}</span>
        <p class="fact-text">{{ item.text }}</p>
      </div>
    }
  </div>
</section>
