<div class="cursor-container" [class.hidden]="!isActive">
  <div class="cursor-dot" [style.left.px]="dotX" [style.top.px]="dotY"></div>
  <div class="cursor-ring" 
       [class.hovered]="isHovered" 
       [class.hovered-glass]="isHoveredGlass"
       [class.has-label]="hasLabel"
       [class.has-label-purple]="hasLabelPurple"
       [style.left.px]="ringX" 
       [style.top.px]="ringY">
    <div class="cursor-wave"></div>
    <span class="cursor-label">{{ labelText }}</span>
  </div>
</div>
