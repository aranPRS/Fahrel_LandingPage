<section class="chat-section" id="assistant">
  <div class="chat-container glass-panel">
    <div class="chat-header">
      <div class="header-left">
        <span class="active-dot"></span>
        <span class="header-title">Fahrel Knowledge Bot (Eliza Inspired)</span>
      </div>
      <div class="header-right">
        <span class="mock-window-btn minimize"></span>
        <span class="mock-window-btn expand"></span>
        <span class="mock-window-btn close"></span>
      </div>
    </div>

    <div class="chat-body" #chatBody>
      @for (msg of messages(); track $index) {
        <div class="message-row" [class.user-row]="msg.sender === 'user'" [class.assistant-row]="msg.sender === 'assistant'">
          @if (msg.sender === 'assistant') {
            <div class="avatar">FA</div>
          }
          <div class="message-bubble">
            <p class="message-text">{{ msg.text }}</p>
          </div>
        </div>
      }

      @if (isTyping()) {
        <div class="message-row assistant-row">
          <div class="avatar">FA</div>
          <div class="message-bubble typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      }
    </div>

    <div class="chat-footer">
      <div class="quick-chips-row">
        <span class="quick-label">Popular Topics:</span>
        <div class="chips-container">
          @for (opt of quickOptions; track opt) {
            <button 
              type="button"
              class="chip-btn" 
              [disabled]="buttonsDisabled()"
              (click)="selectOption(opt)">
              {{ opt }}
            </button>
          }
        </div>
      </div>

      <!-- Typing Form -->
      <form (submit)="onFormSubmit($event)" class="chat-input-form">
        <input 
          type="text" 
          class="chat-input-field" 
          placeholder="Ask a question about Fahrel (e.g. skills, projects, contact)..."
          [value]="userInput()"
          (input)="userInput.set($any($event.target).value)"
          [disabled]="buttonsDisabled()" />
        <button type="submit" class="chat-send-btn" [disabled]="buttonsDisabled() || !userInput().trim()">
          <span>Send</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>
  </div>
</section>
